<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>高数陪练 · 陕西专升本</title>
<style>
:root{
  --bg:#0f1115;--card:#171a21;--card2:#1d222b;--line:#262c37;
  --txt:#e9ecf1;--dim:#98a2b3;--brand:#4c8dff;--ok:#3fbf7f;--warn:#e0a33c;--err:#e46a6a;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f5f6f8;--card:#ffffff;--card2:#f0f2f5;--line:#e3e6eb;--txt:#191c22;--dim:#646c7a;
  --brand:#2b6cf6;--ok:#159a5c;--warn:#a9761c;--err:#cc4242}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.hdr{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-row{display:flex;align-items:center;gap:8px}
.logo{width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;
  font-family:"Times New Roman",serif;font-size:18px;line-height:1;flex:none}
.hdr-t{font-size:15px;font-weight:600}
.hdr-d{margin-left:auto;font-size:12px;color:var(--dim)}
.hdr-d b{color:var(--brand);font-size:15px;margin:0 2px}
main{max-width:680px;margin:0 auto;padding:12px 14px 24px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;appearance:none;border:0;background:none;color:var(--dim);font:inherit;font-size:11px;
  padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button .ic{font-size:17px;line-height:1}
.tabs button.on{color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .sp{margin-left:auto;font-size:12px;font-weight:400;color:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .k{font-size:12px;color:var(--dim)}
.stat .v{font-size:24px;font-weight:600;margin-top:2px}
.stat .v i{font-size:12px;font-style:normal;font-weight:400;color:var(--dim);margin-left:3px}
.bar{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.grow{flex:1;min-width:0}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dim{color:var(--dim)}
.small{font-size:12px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:0 8px;font-size:11px;
  line-height:18px;color:var(--dim);white-space:nowrap;flex:none}
.pill.hot{color:var(--err);border-color:var(--err)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.btn{appearance:none;font:inherit;font-size:13px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--card2);color:var(--txt)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.g{background:transparent}
.btn.on{border-color:var(--brand);color:var(--brand)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .btn{flex:none}
.eq{font-family:"Cambria Math","Times New Roman",serif;font-size:15px;line-height:1.65;
  background:var(--card2);border-radius:10px;padding:9px 11px;overflow-x:auto;white-space:nowrap}
.q{font-family:"Cambria Math","Times New Roman",serif;font-size:15px;line-height:1.7;word-break:break-word}
.sol{margin-top:8px;padding:9px 11px;border-left:2px solid var(--brand);background:var(--card2);
  border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.65}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:76px}
.chk{width:17px;height:17px;border-radius:50%;border:1px solid var(--line);flex:none;display:grid;place-items:center;
  font-size:10px;color:transparent}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
input,textarea,select{font:inherit;color:inherit}
.inp{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:14px}
textarea.inp{min-height:56px;resize:vertical}
.empty{padding:26px 16px;text-align:center;color:var(--dim);border:1px dashed var(--line);border-radius:14px}
details.chap{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
details.chap>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:9px}
details.chap>summary::-webkit-details-marker{display:none}
details.chap .bd{border-top:1px solid var(--line);padding:2px 14px 8px}
.warnbar{background:var(--warn);color:#231a08;font-size:12px;padding:6px 14px;text-align:center}
</style>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="陕西专升本高等数学：考点、公式、134 道题库、错题本、今日一练，离线可用。">
</head>
<body>
<header class="hdr">
  <div class="hdr-row">
    <div class="logo">∫</div>
    <div>
      <div class="hdr-t">高数陪练</div>
      <div class="small dim">陕西专升本 · 150 分 / 150 分钟</div>
    </div>
    <div class="hdr-d">距考试 <b id="cd">—</b> 天</div>
  </div>
</header>
<div id="notice"></div>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-tab="overview" class="on"><span class="ic">◎</span>概览</button>
  <button data-tab="syllabus"><span class="ic">☰</span>考点</button>
  <button data-tab="formulas"><span class="ic">ƒ</span>公式</button>
  <button data-tab="practice"><span class="ic">✎</span>刷题</button>
  <button data-tab="wrong"><span class="ic">✗</span>错题</button>
</nav>
<script>
const P = (id, name, freq, tip) => ({ id: id, name: name, freq: freq, tip: tip });

    const CHAPTERS = [
      {
        id: 'ch1', title: '第一章 函数、极限与连续', weight: '约 22 分',
        points: [
          P('p1-1', '函数定义域与复合函数', 1, '先看分母≠0、偶次根号≥0、对数真数>0，再取交集。'),
          P('p1-2', '七个未定式：0/0、∞/∞、∞−∞、0·∞、1^∞、0^0、∞^0', 3, '先判型再选法：等价无穷小、有理化、通分、取对数。你现在学的 ∞−∞ 就是这一节。'),
          P('p1-3', '等价无穷小替换', 3, '乘除可以整体换，加减不要单独换（除非用泰勒确认主部）。'),
          P('p1-4', '两个重要极限', 3, 'lim sinx/x=1；lim(1+1/x)^x=e。1^∞ 一律化成 e^{lim v(u−1)}。'),
          P('p1-5', '洛必达法则', 3, '只有 0/0 或 ∞/∞ 才能用；用完检查是否化简、是否循环。'),
          P('p1-6', '左右极限与分段点连续', 2, '分段点、|x|、e^{1/x} 都要分左右；左右极限相等才连续。'),
          P('p1-7', '间断点分类', 2, '可去（极限存在）、跳跃（左右存在但不等）、无穷、振荡。'),
          P('p1-8', '零点定理与介值定理', 2, '证明“至少有一个根”就构造函数并找两端异号。'),
          P('p1-9', '数列极限与夹逼准则', 1, 'n 项和先放缩再夹逼，别硬算。'),
        ],
      },
      {
        id: 'ch2', title: '第二章 一元函数微分学', weight: '约 20 分',
        points: [
          P('p2-1', '导数定义与可导/连续关系', 3, '可导必连续，连续不一定可导（y=|x| 在 0 点）。'),
          P('p2-2', '基本求导公式', 3, '每天默写一遍，重点是反三角与 sec/csc。'),
          P('p2-3', '复合函数求导', 3, '由外向内一层层剥，别忘了乘内层导数。'),
          P('p2-4', '隐函数求导', 3, '两边对 x 求导，把 y 看成 y(x)，最后解出 y′。'),
          P('p2-5', '参数方程求导', 2, 'dy/dx = y′(t)/x′(t)；二阶导再除以 x′(t)。'),
          P('p2-6', '对数求导法（幂指函数）', 2, 'y=x^x、y=(sinx)^x 一律先取对数。'),
          P('p2-7', '高阶导数', 1, 'x^n、e^{ax}、sin ax 的 n 阶导有固定规律。'),
          P('p2-8', '微分与近似计算', 1, 'dy=f′(x)dx；f(x0+Δx)≈f(x0)+f′(x0)Δx。'),
          P('p2-9', '切线、法线方程', 2, '点斜式 y−y0=f′(x0)(x−x0)，法线斜率 −1/f′(x0)。'),
        ],
      },
      {
        id: 'ch3', title: '第三章 微分中值定理与导数应用', weight: '约 18 分',
        points: [
          P('p3-1', '罗尔、拉格朗日、柯西中值定理', 3, '看到 f(b)−f(a) 想拉格朗日；看到两个函数之比想柯西。'),
          P('p3-2', '单调性与极值', 3, '先求 f′ 的零点和不可导点，再列表看符号变化。'),
          P('p3-3', '凹凸性与拐点', 2, 'f″>0 凹（向上），f″ 变号处才是拐点。'),
          P('p3-4', '闭区间最值', 2, '比较驻点值和两个端点值，别漏端点。'),
          P('p3-5', '渐近线', 3, '垂直看分母零点，水平看 x→∞，斜的用 k=lim f/x、b=lim(f−kx)。'),
          P('p3-6', '方程根的个数', 2, '单调性 + 端点（或极限）符号，一段最多一根。'),
          P('p3-7', '不等式证明', 2, '移项构造函数 f，用单调性或最值证明。'),
        ],
      },
      {
        id: 'ch4', title: '第四章 不定积分', weight: '约 15 分',
        points: [
          P('p4-1', '原函数与不定积分概念', 2, '连续函数一定有原函数；结果别忘 +C。'),
          P('p4-2', '基本积分表', 3, '背到条件反射：∫dx/x、∫sec²x、∫dx/(a²+x²)。'),
          P('p4-3', '第一类换元（凑微分）', 3, '看到 f(g(x))g′(x) 就把 g′(x)dx 凑成 dg(x)。'),
          P('p4-4', '第二类换元（三角代换）', 3, '√(a²−x²) 用 x=a sin t，√(a²+x²) 用 x=a tan t，√(x²−a²) 用 x=a sec t。'),
          P('p4-5', '分部积分', 3, '∫u dv=uv−∫v du；选 u 的顺序：反、对、幂、三、指。'),
          P('p4-6', '有理函数积分', 2, '假分式先做除法，真分式拆部分分式。'),
          P('p4-7', '三角有理式积分', 1, '万能代换 t=tan(x/2) 是最后手段。'),
        ],
      },
      {
        id: 'ch5', title: '第五章 定积分及其应用', weight: '约 18 分',
        points: [
          P('p5-1', '定积分定义与性质', 2, '线性、区间可加、估值与比较大小。'),
          P('p5-2', '奇偶性与对称性', 3, '对称区间上奇函数积分为 0，偶函数翻倍，能省一半时间。'),
          P('p5-3', '变上限积分求导', 3, 'F′(x)=f(φ(x))φ′(x)；上限是 x² 时别忘乘 2x。'),
          P('p5-4', '牛顿-莱布尼茨公式', 3, '先找原函数再代上下限，注意被积函数在区间内是否连续。'),
          P('p5-5', '定积分换元与分部', 2, '换元必换限，换限后不用回代。'),
          P('p5-6', '反常积分', 3, '先算定积分再取极限；两端都反常要拆开分别判。'),
          P('p5-7', '面积与旋转体体积', 3, '面积 ∫|f−g|dx；绕 x 轴 V=π∫f²dx。'),
          P('p5-8', '定积分证明题', 2, '常用积分中值定理、变上限函数构造、柯西不等式。'),
        ],
      },
      {
        id: 'ch6', title: '第六章 向量代数与空间解析几何', weight: '约 10 分',
        points: [
          P('p6-1', '向量的点积与叉积', 3, 'a·b=0 垂直，a×b=0 平行；叉积方向用右手定则。'),
          P('p6-2', '平面方程', 3, '点法式 A(x−x0)+B(y−y0)+C(z−z0)=0。'),
          P('p6-3', '直线方程', 3, '对称式 (x−x0)/m=(y−y0)/n=(z−z0)/p，方向向量 (m,n,p)。'),
          P('p6-4', '夹角、距离与位置关系', 2, '线面夹角用 sin，面面夹角用 cos，点到平面用距离公式。'),
          P('p6-5', '曲面与空间曲线', 1, '球面、柱面、旋转抛物面认方程即可。'),
        ],
      },
      {
        id: 'ch7', title: '第七章 多元函数微分学', weight: '约 15 分',
        points: [
          P('p7-1', '二元函数定义域与极限', 1, '开区域、闭区域、边界，了解即可。'),
          P('p7-2', '偏导数与全微分', 3, '对 x 求偏导时把 y 当常数；可微 ⇒ 偏导存在，反之不成立。'),
          P('p7-3', '复合函数链式法则', 3, '画变量关系树，一条路径乘一次，多条路径相加。'),
          P('p7-4', '隐函数求导', 3, 'F(x,y,z)=0 时 z_x=−F_x/F_z，注意负号。'),
          P('p7-5', '无条件极值', 3, '先解 z_x=z_y=0，再用 AC−B² 判别。'),
          P('p7-6', '条件极值（拉格朗日乘数法）', 2, '构造 L=f+λg，解方程组，比较各点函数值。'),
          P('p7-7', '几何应用（切平面、法线）', 1, 'F_x,F_y,F_z 就是法向量。'),
        ],
      },
      {
        id: 'ch8', title: '第八章 二重积分', weight: '约 12 分',
        points: [
          P('p8-1', '二重积分概念与性质', 1, '几何意义是曲顶柱体体积；可加性、比较定理。'),
          P('p8-2', '直角坐标计算', 3, '先画区域，再定 X 型或 Y 型：内层上下限是函数，外层是常数。'),
          P('p8-3', '交换积分次序', 3, '画图重新定限，这是最常考的小题。'),
          P('p8-4', '极坐标计算', 3, '圆、扇形、环域一律极坐标：dσ=r dr dθ。'),
          P('p8-5', '对称性与奇偶性', 3, '区域关于 y 轴对称时，被积函数对 x 为奇则积分为 0。'),
          P('p8-6', '二重积分应用', 1, '求体积；被积函数取 1 时是面积。'),
        ],
      },
      {
        id: 'ch9', title: '第九章 无穷级数', weight: '约 10 分',
        points: [
          P('p9-1', '级数收敛与部分和', 2, '收敛 ⇔ 部分和数列有极限；收敛则通项趋于 0（反之不成立）。'),
          P('p9-2', '几何级数与 p 级数', 3, '∑q^n 收敛 ⇔ |q|<1；∑1/n^p 收敛 ⇔ p>1。'),
          P('p9-3', '正项级数审敛法', 3, '先看通项是否趋于 0，再用比较或比值审敛。'),
          P('p9-4', '交错级数与莱布尼茨判别', 2, 'a_n 单调递减且趋于 0 即收敛。'),
          P('p9-5', '绝对收敛与条件收敛', 3, '先判 |u_n|，绝对收敛最强；否则再看原级数。'),
          P('p9-6', '幂级数收敛半径与收敛域', 3, 'R=lim|a_n/a_{n+1}|，端点必须单独验。'),
          P('p9-7', '幂级数求和与函数展开', 3, 'e^x、sin x、cos x、ln(1+x)、1/(1−x) 五个必须背。'),
        ],
      },
      {
        id: 'ch10', title: '第十章 常微分方程', weight: '约 12 分',
        points: [
          P('p10-1', '基本概念：阶、通解、特解', 1, '阶数=最高阶导数；通解中任意常数个数=阶数。'),
          P('p10-2', '可分离变量方程', 3, '把 y 和 x 分到两边再积分，别忘常数 C。'),
          P('p10-3', '齐次方程', 2, '形如 y′=φ(y/x)，令 u=y/x，则 y′=u+xu′。'),
          P('p10-4', '一阶线性方程', 3, '套公式 y=e^{−∫P}(∫Qe^{∫P}dx+C)，先化成标准形。'),
          P('p10-5', '可降阶方程', 1, 'y″=f(x) 直接积两次；缺 y 令 p=y′，缺 x 令 p(y)。'),
          P('p10-6', '二阶常系数齐次线性方程', 3, '特征方程三种根：两实根、重根、共轭复根。'),
          P('p10-7', '二阶常系数非齐次', 2, '特解形式看右端：e^{λx}P(x)、三角型，用待定系数。'),
        ],
      },
    ];

    const F = (id, group, name, expr, note) => ({ id: id, group: group, name: name, expr: expr, note: note });

    const FORMULAS = [
      F('f1', '极限', '等价无穷小（x→0）', 'sin x ~ tan x ~ arcsin x ~ arctan x ~ ln(1+x) ~ e^x−1 ~ x', '乘除可整体替换，加减慎用'),
      F('f2', '极限', '等价无穷小（x→0）', '1−cos x ~ x²/2；(1+x)^a−1 ~ ax；a^x−1 ~ x ln a', ''),
      F('f3', '极限', '三阶等价无穷小（x→0）', 'x−sin x ~ x³/6；tan x−x ~ x³/3；x−ln(1+x) ~ x²/2', '加减抵消到低阶时用它'),
      F('f4', '极限', '重要极限一', 'lim(x→0) sin x / x = 1', ''),
      F('f5', '极限', '重要极限二', 'lim(x→∞) (1+1/x)^x = lim(x→0)(1+x)^{1/x} = e', ''),
      F('f6', '极限', '1^∞ 型公式', 'lim u^v = e^{lim v·(u−1)}', 'u→1，v→∞'),
      F('f7', '极限', '洛必达法则', 'lim f/g = lim f′/g′（0/0 或 ∞/∞）', '必须先验证型，且右端极限存在'),

      F('f8', '导数', '幂函数', '(x^a)′ = a·x^{a−1}', ''),
      F('f9', '导数', '指数函数', '(a^x)′ = a^x·ln a；(e^x)′ = e^x', ''),
      F('f10', '导数', '对数函数', '(log_a x)′ = 1/(x·ln a)；(ln|x|)′ = 1/x', ''),

const LEVEL = { basic: '基础', mid: '中档', hard: '提高' };
const TYPE = { fill: '填空', choice: '选择', calc: '计算', proof: '证明' };

CHAPTERS.forEach(function (c) {
  CHT[c.id] = c.title;

});
const PROB = {};

const KEY = 'gaoshu.mobile.v1';
let STORAGE_OK = true;
(function probe() {
  try { localStorage.setItem('__gs', '1'); localStorage.removeItem('__gs'); }
  catch (e) { STORAGE_OK = false; }
})();

function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function dayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function blank() {
  return { examDate: '2027-04-11', currentChapter: 'ch1', mastery: {}, formulas: {}, problems: {}, wrong: {}, notes: {}, daily: {},
    total: { attempts: 0, correct: 0 } };
}
function load() {
  if (!STORAGE_OK) return blank();
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return blank();
    const s = JSON.parse(raw);
    const b = blank();
    return { examDate: s.examDate || b.examDate, currentChapter: s.currentChapter || b.currentChapter,
      mastery: s.mastery || {}, formulas: s.formulas || {},
      problems: s.problems || {}, wrong: s.wrong || {}, notes: s.notes || {}, daily: s.daily || {},
      total: { attempts: (s.total && s.total.attempts) || 0, correct: (s.total && s.total.correct) || 0 } };
  } catch (e) { return blank(); }
}
let state = load();
function save() {
  if (!STORAGE_OK) return;
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { STORAGE_OK = false; notice(); }
}
function notice() {
  document.getElementById('notice').innerHTML = STORAGE_OK ? ''
    : '<div class="warnbar">当前打开方式不能保存进度，请用 Safari / Chrome 直接打开本文件</div>';
}
notice();

const ui = { tab: 'overview', search: '', ch: 'all', lv: 'all', todo: false, showResolved: false, open: {}, f: 'all', daily: false };

function day(k) {
  const d = state.daily[k] || {};
  return { attempts: d.attempts || 0, correct: d.correct || 0, reviews: d.reviews || 0, mastery: d.mastery || 0 };
}
function daysLeft() {
  const p = String(state.examDate).split('-');
  if (p.length !== 3) return null;
  const t = new Date(+p[0], +p[1] - 1, +p[2]);
  if (isNaN(t)) return null;
  const n = new Date();
  const today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.round((t - today) / 86400000);
}
function streak() {
  let n = 0; const d = new Date();
  if (!(state.daily[dayKey(d)] || {}).attempts) d.setDate(d.getDate() - 1);
  for (let i = 0; i < 400; i++) {
    const r = state.daily[dayKey(d)];
    if (!r || !r.attempts) break;
    n++; d.setDate(d.getDate() - 1);
  }
  return n;
}
function masteredCount() { return ALLPTS.filter(function (p) { return state.mastery[p.id] === 2; }).length; }

function seededRandom(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function dailySeed() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}
function scopeProblems() {
  const cur = state.currentChapter || 'ch1';
  if (cur === 'all') return PROBLEMS;
  let idx = -1;
  CHAPTERS.forEach(function (c, i) { if (c.id === cur) idx = i; });
  if (idx < 0) return PROBLEMS;
  const allowed = {};
  CHAPTERS.slice(0, idx + 1).forEach(function (c) { allowed[c.id] = true; });
  return PROBLEMS.filter(function (p) { return allowed[p.ch]; });
}
function scopeTitle() {
  const cur = state.currentChapter || 'ch1';
  if (cur === 'all') return '全部章节';
  const c = CHAPTERS.filter(function (x) { return x.id === cur; })[0];
  return c ? c.title.split(' ')[0] : '第一章';
}
function dailySet() {
  const pool = scopeProblems();
  const target = Math.min(10, pool.length);
  const rnd = seededRandom(dailySeed());
  const shuffled = pool.map(function (p) { return { p: p, r: rnd() }; })
    .sort(function (a, b) { return a.r - b.r; })
    .map(function (x) { return x.p; });
  const wrongIds = {};
  Object.keys(state.wrong).forEach(function (id) { if (!state.wrong[id].resolved) wrongIds[id] = true; });
  const picks = [];
  shuffled.forEach(function (p) { if (picks.length < 4 && wrongIds[p.id]) picks.push(p); });
  shuffled.forEach(function (p) {
    if (picks.length >= target || wrongIds[p.id] || state.problems[p.id]) return;
    picks.push(p);
  });
  shuffled.forEach(function (p) {
    if (picks.length >= target || picks.indexOf(p) >= 0) return;
    picks.push(p);
  });
  return picks.slice(0, target);
}
function bump(field) {
  const k = dayKey();
  const d = Object.assign({ attempts: 0, correct: 0, reviews: 0, mastery: 0 }, state.daily[k] || {});
  d[field] += 1;
  state.daily[k] = d;
}
function freqPill(f) {
  if (f === 3) return '<span class="pill hot">高频</span>';
  if (f === 2) return '<span class="pill">常考</span>';
  return '<span class="pill">了解</span>';
}
function mastLabel(v) { return v === 2 ? '已掌握' : v === 1 ? '学过' : '未学'; }

  const plan = [
    ['练习 10 道题', t.attempts >= 10, t.attempts + '/10'],
    ['复习 3 道错题', t.reviews >= 3, t.reviews + '/3'],

  plan.forEach(function (p) {

    const n = c.points.length, g = c.points.filter(function (p) { return state.mastery[p.id] === 2; }).length;
    h += '<div class="row"><div class="grow"><div class="small clip">' + esc(c.title) + '</div>'
      + '<div class="bar"><i style="width:' + (n ? g / n * 100 : 0) + '%"></i></div></div>'
      + '<span class="small dim">' + g + '/' + n + '</span></div>';
  });

function viewSyllabus() {
  let h = '<div class="chips">'
    + chip('f-all', '全部', ui.f === 'all') + chip('f-todo', '未掌握', ui.f === 'todo') + chip('f-hot', '仅高频', ui.f === 'hot')

function chip(act, label, on) {
  return '<button class="btn ' + (on ? 'on' : 'g') + '" data-act="' + act + '">' + label + '</button>';
}

function formulaList() {
  const q = ui.search.trim().toLowerCase();
  let h = '';
  const groups = [];
  FORMULAS.forEach(function (f) {
    if (q && (f.name + f.expr + f.note + f.group).toLowerCase().indexOf(q) < 0) return;
    let g = groups.filter(function (x) { return x.name === f.group; })[0];
    if (!g) { g = { name: f.group, items: [] }; groups.push(g); }
    g.items.push(f);
  });
  if (!groups.length) return '<div class="empty">没有匹配的公式</div>';
  groups.forEach(function (g) {
    h += '<div class="card"><h3>' + esc(g.name) + '<span class="sp">' + g.items.length + '</span></h3>';
    g.items.forEach(function (f) {
      const done = !!state.formulas[f.id];
      h += '<div style="border-top:1px solid var(--line);padding:10px 0">'
        + '<div class="small dim" style="display:flex;align-items:center;gap:8px;margin-bottom:5px">'
        + '<span style="color:var(--txt);font-weight:600">' + esc(f.name) + '</span>'
        + '<button class="pill ' + (done ? 'ok' : '') + '" style="margin-left:auto;height:24px" data-act="fmem" data-f="' + f.id + '">' + (done ? '✓ 已背' : '标记已背') + '</button></div>'
        + '<div class="eq">' + esc(f.expr) + '</div>'
        + (f.note ? '<div class="small dim" style="margin-top:5px">' + esc(f.note) + '</div>' : '')
        + '</div>';
    });
    h += '</div>';
  });
  return h;
}

function viewFormulas() {
  const done = FORMULAS.filter(function (f) { return state.formulas[f.id]; }).length;
  return '<div class="card" style="padding:10px 12px">'
    + '<input class="inp" id="search" placeholder="搜索公式或知识点…" value="' + esc(ui.search) + '">'
    + '<div class="small dim" style="margin-top:6px">已背 ' + done + ' / ' + FORMULAS.length + '</div></div>'
    + '<div id="flist">' + formulaList() + '</div>';
}

function viewPractice() {
  let h = '<div class="chips">'
    + '<button class="btn ' + (ui.daily ? 'on' : 'g') + '" data-act="daily">今日一练</button>'
    + '<select class="btn" id="fch" style="flex:none">'
    + '<option value="all"' + (ui.ch === 'all' ? ' selected' : '') + '>全部章节</option>'
    + CHAPTERS.map(function (c) { return '<option value="' + c.id + '"' + (ui.ch === c.id ? ' selected' : '') + '>' + esc(c.title.split(' ')[0]) + '</option>'; }).join('')
    + '</select>';
  ['all', 'basic', 'mid', 'hard'].forEach(function (lv) {
    h += '<button class="btn ' + (ui.lv === lv ? 'on' : 'g') + '" data-act="lv" data-lv="' + lv + '">' + (lv === 'all' ? '全部' : LEVEL[lv]) + '</button>';
  });
  h += '<button class="btn ' + (ui.todo ? 'on' : 'g') + '" data-act="todo">只看未做</button></div>';

  const list = ui.daily ? dailySet() : PROBLEMS.filter(function (p) {
    if (ui.ch !== 'all' && p.ch !== ui.ch) return false;
    if (ui.lv !== 'all' && p.level !== ui.lv) return false;
    if (ui.todo && state.problems[p.id]) return false;
    return true;
  });
  const done = PROBLEMS.filter(function (p) { return state.problems[p.id]; }).length;
  const dDone = dailySet().filter(function (p) { return state.problems[p.id]; }).length;
  h += '<div class="small dim" style="margin:0 0 10px">'
    + (ui.daily ? '今日一练 · ' + scopeTitle() + ' · 每天 0 点换题 · 已完成 ' + dDone + '/' + dailySet().length : '已做 ' + done + ' / ' + PROBLEMS.length)
    + '</div>';

  if (!list.length) return h + '<div class="empty">这个筛选下没有题目</div>';

  list.forEach(function (p) {
    const r = state.problems[p.id];
    const o = ui.open;
    h += '<div class="card">'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">'
      + '<span class="pill">' + esc(CHT[p.ch].split(' ')[0]) + '</span>'
      + '<span class="pill">' + TYPE[p.type] + '</span>'
      + '<span class="pill">' + LEVEL[p.level] + '</span>'
      + (r ? '<span class="pill ' + (r.result === 'right' ? 'ok' : 'hot') + '">' + (r.result === 'right' ? '✓ 做对' : '✗ 做错') + '</span>' : '')
      + '</div>'
      + '<div class="q">' + esc(p.q) + '</div>'
      + (o[p.id + ':h'] ? '<div class="sol"><b>提示：</b>' + esc(p.hint) + '</div>' : '')
      + (o[p.id + ':a'] ? '<div class="sol"><b>答案：</b>' + esc(p.answer) + '</div>' : '')
      + (o[p.id + ':s'] ? '<div class="sol"><b>解析：</b>' + esc(p.sol) + '</div>' : '')
      + '<div class="acts">'
      + '<button class="btn g" data-act="tog" data-k="' + p.id + ':h">提示</button>'
      + '<button class="btn g" data-act="tog" data-k="' + p.id + ':a">答案</button>'
      + '<button class="btn g" data-act="tog" data-k="' + p.id + ':s">解析</button>'
      + '</div>'
      + '<div class="acts">'
      + '<button class="btn p" data-act="mark" data-p="' + p.id + '" data-ok="1">我答对了</button>'
      + '<button class="btn" data-act="mark" data-p="' + p.id + '" data-ok="0">答错了</button>'
      + '</div></div>';
  });
  return h;
}

function viewWrong() {
  const entries = Object.keys(state.wrong).map(function (id) {
    return PROB[id] ? { p: PROB[id], w: state.wrong[id] } : null;
  }).filter(Boolean)
    .filter(function (e) { return ui.showResolved || !e.w.resolved; })
    .sort(function (a, b) { return (a.w.resolved ? 1 : 0) - (b.w.resolved ? 1 : 0) || (b.w.at || 0) - (a.w.at || 0); });

  const pending = Object.keys(state.wrong).filter(function (id) { return !state.wrong[id].resolved; }).length;
  let h = '<div class="chips"><button class="btn ' + (ui.showResolved ? 'on' : 'g') + '" data-act="resolved">显示已掌握</button>'
    + '<span class="small dim" style="align-self:center;margin-left:auto">' + pending + ' 道待复习</span></div>';

  if (!entries.length) return h + '<div class="empty">错题本还是空的，做错的题会自动进来</div>';

  entries.forEach(function (e) {
    const p = e.p, w = e.w;
    h += '<div class="card">'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">'
      + '<span class="pill">' + esc(CHT[p.ch].split(' ')[0]) + '</span>'
      + '<span class="pill hot">错 ' + w.count + ' 次</span>'
      + (w.resolved ? '<span class="pill ok">已掌握</span>' : '')
      + '</div>'
      + '<div class="q">' + esc(p.q) + '</div>'
      + '<div class="sol"><b>答案：</b>' + esc(p.answer) + '</div>'
      + (ui.open[p.id + ':s'] ? '<div class="sol"><b>解析：</b>' + esc(p.sol) + '</div>' : '')
      + '<div class="small dim" style="margin-top:10px">我的错因</div>'
      + '<textarea class="inp" data-note="' + p.id + '" placeholder="错在哪：符号？换元？忘记 +C？">' + esc(state.notes[p.id] || '') + '</textarea>'
      + '<div class="acts">'
      + '<button class="btn g" data-act="tog" data-k="' + p.id + ':s">' + (ui.open[p.id + ':s'] ? '收起解析' : '查看解析') + '</button>'
      + '<button class="btn p" data-act="review" data-p="' + p.id + '">再练一次（答对）</button>'
      + (w.resolved ? '' : '<button class="btn" data-act="resolve" data-p="' + p.id + '">标记已掌握</button>')
      + '</div></div>';
  });
  return h;
}

function render() {
  const y = window.scrollY;
  const v = document.getElementById('view');
  if (ui.tab === 'overview') v.innerHTML = viewOverview();
  else if (ui.tab === 'syllabus') v.innerHTML = viewSyllabus();
  else if (ui.tab === 'formulas') v.innerHTML = viewFormulas();
  else if (ui.tab === 'practice') v.innerHTML = viewPractice();
  else v.innerHTML = viewWrong();

  const dl = daysLeft();
  document.getElementById('cd').textContent = dl === null ? '—' : Math.max(dl, 0);
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
    b.classList.toggle('on', b.getAttribute('data-tab') === ui.tab);
  });
  window.scrollTo(0, y);
}

document.getElementById('tabs').addEventListener('click', function (e) {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  ui.tab = b.getAttribute('data-tab');
  window.scrollTo(0, 0);
  render();
});

document.getElementById('view').addEventListener('click', function (e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');

  if (act === 'f-all' || act === 'f-todo' || act === 'f-hot') { ui.f = act.slice(2); render(); return; }
  if (act === 'lv') { ui.lv = el.getAttribute('data-lv'); render(); return; }
  if (act === 'todo') { ui.todo = !ui.todo; render(); return; }
  if (act === 'daily') { ui.daily = !ui.daily; render(); return; }
  if (act === 'resolved') { ui.showResolved = !ui.showResolved; render(); return; }
  if (act === 'tog') { const k = el.getAttribute('data-k'); ui.open[k] = !ui.open[k]; render(); return; }
  if (act === 'goChapter') {
    const ch = el.getAttribute('data-ch');
    ui.open[ch] = true; ui.f = 'all'; ui.tab = 'syllabus'; render(); return;
  }
  if (act === 'goWrong') { ui.tab = 'wrong'; render(); return; }

  if (act === 'mast') {
    const id = el.getAttribute('data-p');
    const cur = state.mastery[id] || 0;
    const nxt = (cur + 1) % 3;
    state.mastery[id] = nxt;
    if (nxt === 2 && cur !== 2) bump('mastery');
    save(); render(); return;
  }
  if (act === 'fmem') {
    const id = el.getAttribute('data-f');
    if (state.formulas[id]) delete state.formulas[id]; else state.formulas[id] = true;
    save(); render(); return;
  }
  if (act === 'mark') {
    const id = el.getAttribute('data-p'), ok = el.getAttribute('data-ok') === '1';
    bump('attempts'); if (ok) bump('correct');
    state.total.attempts += 1; if (ok) state.total.correct += 1;
    state.problems[id] = { result: ok ? 'right' : 'wrong', at: Date.now() };
    const w = state.wrong[id];
    if (!ok) {
      state.wrong[id] = { count: (w ? w.count : 0) + 1, right: 0, resolved: false, at: Date.now() };
    } else if (w) {
      const right = (w.right || 0) + 1;
      state.wrong[id] = { count: w.count, right: right, resolved: right >= 2 ? true : !!w.resolved, at: Date.now() };
    }
    save(); render(); return;
  }
  if (act === 'review') {
    const id = el.getAttribute('data-p');
    bump('reviews');
    const w = state.wrong[id];
    const right = ((w && w.right) || 0) + 1;
    if (w) state.wrong[id] = { count: w.count, right: right, resolved: right >= 2 ? true : !!w.resolved, at: Date.now() };
    state.problems[id] = { result: 'right', at: Date.now() };
    save(); render(); return;
  }
  if (act === 'resolve') {
    const id = el.getAttribute('data-p');
    bump('reviews');
    if (state.wrong[id]) state.wrong[id] = Object.assign({}, state.wrong[id], { resolved: true, at: Date.now() });
    save(); render(); return;
  }
  if (act === 'reset') {
    if (window.confirm('确定清空所有学习记录吗？')) { state = blank(); save(); render(); }
    return;
  }
});

document.getElementById('view').addEventListener('input', function (e) {
  const t = e.target;
  if (t.id === 'exam') {
    state.examDate = t.value; save();
    const dl = daysLeft();
    document.getElementById('cd').textContent = dl === null ? '—' : Math.max(dl, 0);
    return;
  }
  if (t.id === 'search') {
    ui.search = t.value;
    const box = document.getElementById('flist');
    if (box) box.innerHTML = formulaList();
    return;
  }
  if (t.hasAttribute('data-note')) {
    state.notes[t.getAttribute('data-note')] = t.value;
    clearTimeout(window.__nt);
    window.__nt = setTimeout(save, 400);
  }
});

document.getElementById('view').addEventListener('change', function (e) {
  if (e.target.id === 'fch') { ui.ch = e.target.value; render(); }
  if (e.target.id === 'chap') { state.currentChapter = e.target.value; save(); render(); }
});

document.getElementById('view').addEventListener('toggle', function (e) {
  const d = e.target;
  if (d.tagName === 'DETAILS' && d.getAttribute('data-ch')) ui.open[d.getAttribute('data-ch')] = d.open;
}, true);

render();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
