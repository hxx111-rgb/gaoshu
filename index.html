function pad2(n) { return n < 10 ? '0' + n : String(n); }
function dayKey(date) {
  const d = date || new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function parseDate(s) {
  const p = String(s || '').split('-');
  if (p.length !== 3) return null;
  const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return isNaN(d.getTime()) ? null : d;
}
function daysUntil(dateStr) {
  const target = parseDate(dateStr);
  if (!target) return null;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target.getTime() - today.getTime()) / DAY);
}
function shuffleSeed(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function todaySeed(extra) {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate() + (extra || 0) * 7919;
}
function shuffled(list, seed) {
  const rnd = shuffleSeed(seed);
  return list.map(function (x) { return { x: x, r: rnd() }; })
    .sort(function (a, b) { return a.r - b.r; })
    .map(function (o) { return o.x; });
}
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function pct(n) { return Math.round(clamp(n, 0, 1) * 100); }
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];

  if (rec.learned) return state;

function norm(s) {
  return String(s == null ? '' : s)
    .replace(/\s+/g, '')
    .replace(/[−–—]/g, '-')
    .replace(/[×·]/g, '*')
    .replace(/\*/g, '')
    .replace(/[（【]/g, '(')
    .replace(/[）】]/g, ')')
    .replace(/，/g, ',')
    .replace(/[{}]/g, '')
    .replace(/^y=/, '')
    .toLowerCase();
}
function checkAnswer(q, input) {
  const user = norm(input);
  if (!user) return false;
  const list = (q.a || []).map(norm);
  return list.some(function (x) { return x === user; });
}

  try { window.localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (err) { /* ignore */ }
}

/* ---------- 做题记录 ---------- */
function recordAttempt(state, qid, ok, input, cost) {
  const q = BANK_MAP[qid];
  const prev = state.bank[qid] || { seen: 0, right: 0, wrong: 0 };
  const today = dayKey();
  const daily = Object.assign({ questions: 0, right: 0, minutes: 0 }, state.dayStats[today] || {});
  daily.questions += 1;
  daily.minutes = (daily.minutes || 0) + (cost || 0);
  if (ok) daily.right += 1;
  const attempts = state.attempts.concat([{ id: qid, m: q && q.m, ok: ok, t: Date.now(), input: String(input || '').slice(0, 80) }]).slice(-400);
  return Object.assign({}, state, {
    bank: Object.assign({}, state.bank, { [qid]: { seen: (prev.seen || 0) + 1, right: (prev.right || 0) + (ok ? 1 : 0), wrong: (prev.wrong || 0) + (ok ? 0 : 1), last: Date.now() } }),
    attempts: attempts,
    dayStats: Object.assign({}, state.dayStats, { [today]: daily }),
  });
}

/* ---------- 错题本 1/3/7/15 ---------- */
function mistakeOf(state, qid) {
  for (let i = 0; i < state.mistakes.length; i += 1) {
    if (state.mistakes[i].id === qid) return state.mistakes[i];
  }
  return null;
}
function addMistake(state, qid, cause, input) {
  const q = BANK_MAP[qid];
  if (!q) return state;
  const exist = mistakeOf(state, qid);
  if (exist) {
    const list = state.mistakes.map(function (m) {
      if (m.id !== qid) return m;
      return Object.assign({}, m, {
        wrong: (m.wrong || 1) + 1,
        cause: cause || m.cause,
        stage: 0,
        nextReview: Date.now() + STAGES[0] * DAY,
        history: (m.history || []).concat([{ at: Date.now(), result: 'wrong' }]),
      });
    });
    return Object.assign({}, state, { mistakes: list });
  }
  const item = {
    id: qid, m: q.m, kp: q.kp, q: q.q, cause: cause || '未归类',
    wrong: 1, stage: 0, nextReview: Date.now() + STAGES[0] * DAY,
    addedAt: Date.now(), history: [{ at: Date.now(), result: 'new', input: String(input || '').slice(0, 60) }],
  };
  return Object.assign({}, state, { mistakes: state.mistakes.concat([item]) });
}
function addCustomMistake(state, payload) {
  const id = 'X-' + Date.now();
  const item = {
    id: id, m: payload.m || state.currentModule, kp: payload.kp || '手动录入',
    q: payload.q || '', cause: payload.cause || '未归类', sig: payload.sig || '',
    s: payload.s || '', custom: true, wrong: 1, stage: 0,
    nextReview: Date.now() + STAGES[0] * DAY, addedAt: Date.now(),
    history: [{ at: Date.now(), result: 'new', input: '' }],
  };
  return Object.assign({}, state, { mistakes: state.mistakes.concat([item]) });
}
function questionOf(state, id) {
  if (BANK_MAP[id]) return BANK_MAP[id];
  const m = mistakeOf(state, id);
  if (m && m.custom) {
    return {
      id: id, m: m.m, kp: m.kp || '手动录入', d: 0, t: '自评', q: m.q, a: [],
      s: m.s || '（没填参考答案，按你手写的过程自评）',
      sig: m.sig || '把这道题的识别信号写在错题本里，下次见同类直接套',
    };
  }
  return null;
}
function dueMistakes(state, now) {
  const t = now || Date.now();
  return state.mistakes.filter(function (m) { return (m.nextReview || 0) <= t; });
}
function reviewMistake(state, qid, ok) {
  const list = state.mistakes.map(function (m) {
    if (m.id !== qid) return m;
    const stage = ok ? clamp((m.stage || 0) + 1, 0, STAGES.length) : 0;
    const gap = STAGES[Math.min(stage, STAGES.length - 1)];
    return Object.assign({}, m, {
      stage: stage,
      nextReview: Date.now() + gap * DAY,
      mastered: stage >= STAGES.length,
      history: (m.history || []).concat([{ at: Date.now(), result: ok ? 'pass' : 'fail' }]),
    });
  });
  return Object.assign({}, state, { mistakes: list });
}

/* ---------- 掌握度 ---------- */
function masteryOf(state, mId) {
  const recent = state.attempts.filter(function (a) { return a.m === mId; }).slice(-20);
  const rel = state.mistakes.filter(function (m) { return m.m === mId; });
  const passed = rel.filter(function (m) { return m.mastered; }).length;
  const rate = recent.length ? recent.filter(function (a) { return a.ok; }).length / recent.length : 0;
  const review = rel.length ? passed / rel.length : 0;
  const sample = recent.length < 5;
  return {
    value: sample ? null : Math.round((rate * 0.7 + review * 0.3) * 100),
    sample: sample,
    done: recent.length,
    rate: rate,
    wrongOpen: rel.filter(function (m) { return !m.mastered; }).length,
  };
}
function overallMastery(state) {
  const ids = MODULES.filter(function (m) { return state.modules[m.id]; }).map(function (m) { return m.id; });
  let sum = 0, n = 0;
  ids.forEach(function (id) {
    const v = masteryOf(state, id);
    if (v.value != null) { sum += v.value; n += 1; }
  });
  return n ? Math.round(sum / n) : null;
}

/* ---------- 计划 ---------- */
function roundOf(dateStr) {
  const t = parseDate(dateStr || dayKey());
  if (!t) return null;
  const ts = t.getTime();
  for (let i = 0; i < PLAN.length; i += 1) {
    const s = parseDate(PLAN[i].start).getTime();
    const e = parseDate(PLAN[i].end).getTime();
    if (ts >= s && ts <= e) return PLAN[i];
  }
  return null;
}
function planSoon(dateStr) {
  const t = parseDate(dateStr || dayKey());
  if (!t) return null;
  const ts = t.getTime();
  for (let i = 0; i < PLAN.length; i += 1) {
    if (ts < parseDate(PLAN[i].start).getTime()) return PLAN[i];
  }
  return null;
}
function planProgress(state) {
  const done = state.attempts.length;
  const started = parseDate(PLAN[0].start);
  const today = new Date();
  const elapsed = Math.max(0, Math.floor((today.getTime() - started.getTime()) / DAY)) + 1;
  const perDay = (state.settings.dailyQuestions || 12);
  const expected = elapsed * perDay;
  return { done: done, expected: expected, behind: Math.max(0, expected - done) };
}

/* ---------- 数学文本渲染（^{}、_{} 转上/下标） ---------- */
function mathTokens(text) {
  const out = [];
  const s = String(text || '');
  let i = 0;
  let buf = '';
  while (i < s.length) {
    const ch = s[i];
    if ((ch === '^' || ch === '_') && s[i + 1] === '{') {
      if (buf) { out.push({ k: 't', v: buf }); buf = ''; }
      let depth = 0, j = i + 1, acc = '';
      for (; j < s.length; j += 1) {
        if (s[j] === '{') { depth += 1; if (depth === 1) continue; }
        if (s[j] === '}') { depth -= 1; if (depth === 0) break; }
        acc += s[j];
      }
      out.push({ k: ch === '^' ? 'sup' : 'sub', v: acc });
      i = j + 1;
      continue;
    }
    buf += ch;
    i += 1;
  }
  if (buf) out.push({ k: 't', v: buf });
  return out;
}
function MathText(props) {
  const tokens = mathTokens(props.text);
  return React.createElement('span', { className: 'mtc-math' }, tokens.map(function (t, idx) {
    if (t.k === 'sup') return React.createElement('sup', { key: idx }, t.v);
    if (t.k === 'sub') return React.createElement('sub', { key: idx }, t.v);
    return React.createElement('span', { key: idx }, t.v);
  }));
}

      h(Pill, null, q.d === 1 ? '基础' : q.d === 2 ? '中档' : '中高'),
      h('span', { className: 'mtc-muted mtc-small' }, q.t)),
    h('div', { className: 'mtc-q' }, h(MathText, { text: q.q })));
}

function PracticeView(props) {
  const state = props.state;
  const set = props.set;
  const mode = props.mode || 'practice';
  const preset = props.preset || null;
  const [cfg, setCfg] = useState(function () {
    return {
      m: preset && preset.m ? preset.m : state.currentModule,
      d: preset && preset.d ? preset.d : 0,
      n: preset && preset.n ? preset.n : (state.settings.dailyQuestions || 8),
    };
  });
  const [queue, setQueue] = useState(null);
  const [idx, setIdx] = useState(0);
  const [input, setInput] = useState('');
  const [tries, setTries] = useState(0);
  const [stage, setStage] = useState(0);
  const [results, setResults] = useState([]);
  const [seed, setSeed] = useState(function () { return Date.now(); });
  const [cause, setCause] = useState('');
  const [left, setLeft] = useState(function () { return preset && preset.timed ? Math.round(preset.timed * 60) : 0; });
  const daily = !!(preset && preset.daily);

  useEffect(function () {
    if (!(preset && preset.timed)) return undefined;
    const t = setInterval(function () { setLeft(function (x) { return x > 0 ? x - 1 : 0; }); }, 1000);
    return function () { clearInterval(t); };
  }, []);

  useEffect(function () {
    if (preset && preset.auto) build();
  }, []);

  const enabled = MODULES.filter(function (m) { return state.modules[m.id]; });
  const curId = queue ? queue[idx] : null;
  const cur = curId ? questionOf(state, curId) : null;

  function build() {
    let ids;
    if (preset && preset.daily) {
      const week = Date.now() - 7 * DAY;
      const recent = state.mistakes
        .filter(function (m) { return (m.addedAt || 0) >= week; })
        .sort(function (a, b) { return (b.addedAt || 0) - (a.addedAt || 0); })
        .slice(0, 3)
        .map(function (m) { return m.id; });
      const pool = BANK.filter(function (q) {
        if (!state.modules[q.m]) return false;
        if (q.t === '证明' && !state.settings.proof) return false;
        return recent.indexOf(q.id) < 0;
      }).map(function (q) { return q.id; });
      ids = recent.concat(shuffled(pool, seed).slice(0, Math.max(0, cfg.n - recent.length)));
    } else if (mode === 'review') {
      ids = preset && preset.only ? [preset.only] : dueMistakes(state).map(function (m) { return m.id; });
    } else {
      const pool = BANK.filter(function (q) {
        if (!state.modules[q.m]) return false;
        if (cfg.m !== 'all' && q.m !== cfg.m) return false;
        if (cfg.d && q.d !== cfg.d) return false;
        if (q.t === '证明' && !state.settings.proof) return false;
        return true;
      });
      ids = preset && preset.only ? [preset.only] : pool.map(function (q) { return q.id; });
    }
    if (!ids.length) return;
    const list = (preset && (preset.daily || preset.only))
      ? ids
      : shuffled(ids, seed + cfg.m.length * 31 + cfg.d * 17).slice(0, mode === 'review' ? ids.length : cfg.n);
    setQueue(list);
    setIdx(0);
    setResults([]);
    setTries(0);
    setStage(0);
    setInput('');
    setCause('');
  }

  function nextOne() {
    setTries(0);
    setStage(0);
    setInput('');
    setCause('');
    setIdx(function (i) { return i + 1; });
  }

  function similar() {
    if (!cur) return;
    const cand = BANK.filter(function (q) {
      return q.id !== cur.id && q.m === cur.m && (q.kp === cur.kp || q.d === cur.d) && queue.indexOf(q.id) < 0;
    });
    if (!cand.length) { nextOne(); return; }
    const pick = shuffled(cand.map(function (q) { return q.id; }), Date.now())[0];
    setQueue(function (old) { return (old || []).concat([pick]); });
    nextOne();
  }

  function submit(value) {
    const q = cur;
    if (!q || stage === 2 || stage === 4) return;
    if (q.t === '证明') return;
    const ok = checkAnswer(q, value);
    if (!ok) {
      const t = tries + 1;
      setTries(t);
      let s2 = recordAttempt(state, q.id, false, value, 0);
      if (t === 1) { s2 = addMistake(s2, q.id, '', value); setStage(1); }
      else if (t === 2) { setStage(3); }
      else { setStage(4); }
      set(s2);
      setResults(results.concat([{ id: q.id, ok: false }]));
      setInput('');
      return;
    }
    let s3 = recordAttempt(state, q.id, true, value, 0);
    if (mode === 'review') s3 = reviewMistake(s3, q.id, true);
    set(s3);
    setResults(results.concat([{ id: q.id, ok: true }]));
    setStage(2);
  }

  function judgeProof(ok) {
    const q = cur;
    if (!q) return;
    let s = recordAttempt(state, q.id, ok, '证明自评', 0);
    if (mode === 'review' && ok) s = reviewMistake(s, q.id, true);
    if (!ok) s = addMistake(s, q.id, '思路选错', '证明自评未过');
    set(s);
    setResults(results.concat([{ id: q.id, ok: ok }]));
    setStage(2);
  }

  function judgeCustom(ok) {
    const q = cur;
    if (!q) return;
    set(reviewMistake(state, q.id, ok));
    setResults(results.concat([{ id: q.id, ok: ok }]));
    nextOne();
  }

  if (!queue) {
    return h('div', null,
      h(Card, null,
        h('h3', null, mode === 'review' ? '错题复习' : '练习',
          h('span', { className: 'n' }, mode === 'review' ? '到期错题 ' + dueMistakes(state).length + ' 条' : '题库 ' + BANK.length + ' 道')),
        mode === 'review'
          ? h('div', { className: 'mtc-small mtc-muted' }, '按 1/3/7/15 天复习曲线到期推送。答对进下一阶段，答错回到第 1 阶段。')
          : h('div', null,
            h('div', { className: 'mtc-toolbar' },
              h('span', { className: 'mtc-muted mtc-small' }, '模块'),
              h('select', {
                className: 'mtc-input', style: { width: 170 }, value: cfg.m,
                onChange: function (e) { setCfg(Object.assign({}, cfg, { m: e.target.value })); },
              }, h('option', { value: 'all' }, '全部模块'), enabled.map(function (m) {
                return h('option', { key: m.id, value: m.id }, m.name);
              }))),
            h('div', { className: 'mtc-toolbar' },
              h('span', { className: 'mtc-muted mtc-small' }, '难度'),
              [0, 1, 2, 3].map(function (d) {
                return h(Btn, { key: d, on: cfg.d === d, onClick: function () { setCfg(Object.assign({}, cfg, { d: d })); } },
                  d === 0 ? '不限' : d === 1 ? '基础' : d === 2 ? '中档' : '中高');
              })),
            h('div', { className: 'mtc-toolbar' },
              h('span', { className: 'mtc-muted mtc-small' }, '题数'),
              [5, 8, 12, 20].map(function (n) {
                return h(Btn, { key: n, on: cfg.n === n, onClick: function () { setCfg(Object.assign({}, cfg, { n: n })); } }, String(n));
              }))),
        h('div', { className: 'mtc-actions' },
          h(Btn, { tone: 'primary', onClick: build }, mode === 'review' ? '开始复习' : '开始练习'),
          h('span', { className: 'mtc-muted mtc-small' }, '答错会自动进错题本，按 1/3/7/15 天复习'))));
  }

  if (idx >= queue.length) {
    const right = results.filter(function (r) { return r.ok; }).length;
    const total = results.length || 1;
    const wrongQs = results.filter(function (r) { return !r.ok; }).map(function (r) { return questionOf(state, r.id); }).filter(Boolean);
    const worst = wrongQs[0];
    const conclusion = !wrongQs.length
      ? '全对，明天把难度升一档。'
      : MOD_MAP[worst.m].name + ' · ' + worst.kp + ' 还不够稳，明天先修这一块。';
    return h('div', null,
      h(Card, null,
        h('h3', null, daily ? '日测完成' : '本组完成'),
        h('div', { className: 'mtc-grid' },
          h(Stat, { k: '正确', v: right + '/' + results.length }),
          h(Stat, { k: '正确率', v: pct(right / total) + '%' })),
        daily ? h('div', { className: 'mtc-feedback' + (wrongQs.length ? '' : ' good') },
          h('div', null, '今日一句话结论：', conclusion)) : null,
        h('div', { className: 'mtc-actions' },
          h(Btn, { tone: 'primary', onClick: function () { setQueue(null); setSeed(Date.now()); } }, daily ? '再来一次日测' : '再来一组'),
          h(Btn, { onClick: props.nav.bind(null, 'today') }, '回今日'))));
  }

  if (!cur) {
    return h('div', null,
      h(Card, null,
        h('h3', null, '这道题已不在题库'),
        h('div', { className: 'mtc-small mtc-muted' }, '可能已从错题本移出。'),
        h('div', { className: 'mtc-actions' }, h(Btn, { tone: 'primary', onClick: nextOne }, '下一题'))));
  }

  return h('div', null,
    h(Card, null,
      h('h3', null, daily ? '日测' : mode === 'review' ? '错题复习' : '练习',
        h('span', { className: 'n' }, (idx + 1) + ' / ' + queue.length + (preset && preset.timed && left ? ' · 剩 ' + Math.floor(left / 60) + ':' + pad2(left % 60) : ''))),
      h(QuestionBlock, { q: cur }),

      cur.t === '选择' ? h('div', null, cur.opt.map(function (o, i) {
        let st = null;
        if (stage === 2) st = checkAnswer(cur, o) ? 'right' : (input === o ? 'wrong' : null);
        if (stage === 4) st = checkAnswer(cur, o) ? 'right' : null;
        return h('button', {
          key: i, type: 'button', className: 'mtc-choice', 'data-state': st || undefined,
          disabled: stage === 2 || stage === 4,
          onClick: function () { setInput(o); submit(o); },
        }, String.fromCharCode(65 + i) + '. ', h(MathText, { text: o }));
      })) : null,

      cur.t === '证明' ? h('div', null,
        h('div', { className: 'mtc-small mtc-muted', style: { marginTop: 10 } }, '证明题按自评计分：先自己写，再对照参考证明。'),
        stage !== 4 ? h('div', { className: 'mtc-actions' },
          h(Btn, { onClick: function () { setStage(4); } }, '看参考证明'),
          stage === 2 ? null : h(Btn, { tone: 'ok', onClick: function () { judgeProof(true); } }, '我证出来了'),
          stage === 2 ? null : h(Btn, { tone: 'hot', onClick: function () { judgeProof(false); } }, '没证出来')) : null) : null,

      cur.t === '自评' ? h('div', null,
        h('div', { className: 'mtc-small mtc-muted', style: { marginTop: 10 } }, '手动录入的错题按自评：先自己完整做一遍，再判断对错。'),
        h('div', { className: 'mtc-actions' },
          h(Btn, { tone: 'ok', onClick: function () { judgeCustom(true); } }, '做对了'),
          h(Btn, { tone: 'hot', onClick: function () { judgeCustom(false); } }, '还是错')),
        cur.s ? h('details', { style: { marginTop: 8 } },
          h('summary', { className: 'mtc-small mtc-muted' }, '看参考答案'),
          h('div', { className: 'mtc-small' }, h(MathText, { text: cur.s }))) : null) : null,

      (cur.t === '填空' || cur.t === '计算') ? h('div', { style: { marginTop: 10 } },
        h('input', {
          className: 'mtc-input', value: input, placeholder: '只写最终答案（如 1/2、e^(-1/2)、(x-1)e^x+C）',
          disabled: stage === 2 || stage === 4,
          onChange: function (e) { setInput(e.target.value); },
          onKeyDown: function (e) { if (e.key === 'Enter') submit(input); },
        }),
        h('div', { className: 'mtc-actions' },
          h(Btn, { tone: 'primary', onClick: function () { submit(input); }, disabled: stage === 2 || stage === 4 }, '提交'))) : null,

      stage === 1 ? h(CausePicker, {
        onPick: function (c) {
          setCause(c);
          set(s => addMistake(s, cur.id, c, input));
          setStage(0);
          setInput('');
        },
      }) : null,

      stage === 3 ? h('div', { className: 'mtc-feedback bad' },
        h('div', null, '还是不对。关键一步：', h(MathText, { text: cur.sig })),
        h('div', { className: 'mtc-small mtc-muted', style: { marginTop: 6 } }, '按这一步重做，别急着算完整题。')) : null,

      stage === 4 ? h('div', { className: 'mtc-feedback' },
        h('div', null, '完整解（第 3 次错，按规则给全解）：'),
        h('div', null, h(MathText, { text: cur.s })),
        h('div', { className: 'mtc-small mtc-muted', style: { marginTop: 6 } }, '识别信号：', h(MathText, { text: cur.sig }))) : null,

      stage === 2 ? h('div', { className: 'mtc-feedback good' },
        h('div', null, '对了。'),
        h('div', { className: 'mtc-small mtc-muted', style: { marginTop: 4 } }, '识别信号：', h(MathText, { text: cur.sig }))) : null,

      h('div', { className: 'mtc-actions' },
        stage === 2 || stage === 4 ? h(Btn, { tone: 'primary', onClick: nextOne }, '下一题') : null,
        stage === 4 ? h(Btn, { onClick: similar }, '来一道同型题') : null,
        stage === 1 || stage === 3 ? h(Btn, { tone: 'ghost', onClick: function () { setStage(4); addMistake(state, cur.id, cause || '未归类', input); } }, '直接看完整解（记入错题本）') : null)));
}

        h('input', {

          placeholder: '考的是什么（如 分部积分）', onChange: function (e) { setFkp(e.target.value); },
        })),
      h('div', { className: 'mtc-toolbar', style: { marginTop: 8 } },
        h('span', { className: 'mtc-small mtc-muted', style: { width: 56, flex: 'none' } }, '错因'),
        CAUSES.map(function (c) {

function FormulasView(props) {
  const state = props.state;
  const [kw, setKw] = useState(props.preset && props.preset.q ? props.preset.q : '');
  const [m, setM] = useState('all');
  const [group, setGroup] = useState('all');
  const list = FORMULAS.filter(function (f) {
    if (!state.modules[f.m]) return false;
    if (m !== 'all' && f.m !== m) return false;
    if (group !== 'all' && f.g !== group) return false;
    if (!kw) return true;
    return (f.q + f.a + (f.n || '') + f.g).toLowerCase().indexOf(kw.toLowerCase()) >= 0;
  });
  const groups = [];
  list.forEach(function (f) { if (groups.indexOf(f.g) < 0) groups.push(f.g); });
  const mods = MODULES.filter(function (x) { return state.modules[x.id]; });

  return h('div', null,
    h(Card, null,
      h('h3', null, '公式库', h('span', { className: 'n' }, FORMULAS.length + ' 条 · 考纲范围')),
      h('input', {
        className: 'mtc-input', placeholder: '搜索：分部积分、极坐标、拉格朗日、收敛半径…',
        value: kw, onChange: function (e) { setKw(e.target.value); },
      }),
      h('div', { className: 'mtc-toolbar', style: { marginTop: 10 } },
        h(Btn, { on: m === 'all', onClick: function () { setM('all'); setGroup('all'); } }, '全部'),
        mods.map(function (x) {
          return h(Btn, { key: x.id, on: m === x.id, onClick: function () { setM(x.id); setGroup('all'); } }, x.short);
        })),
      m !== 'all' ? h('div', { className: 'mtc-toolbar' },
        h(Btn, { on: group === 'all', onClick: function () { setGroup('all'); } }, '全部分组'),
        FORMULAS.filter(function (f) { return f.m === m; }).map(function (f) { return f.g; })
          .filter(function (g, i, arr) { return arr.indexOf(g) === i; })
          .map(function (g) {
            return h(Btn, { key: g, on: group === g, onClick: function () { setGroup(g); } }, g);
          })) : null),

    groups.map(function (g) {
      const items = list.filter(function (f) { return f.g === g; });
      return h(Card, { key: g },
        h('h3', null, g, h('span', { className: 'n' }, items.length + ' 条')),
        items.map(function (f, i) {
          return h('div', { key: i, className: 'mtc-row', style: { alignItems: 'flex-start' } },
            h('div', { className: 'grow' },
              h('div', { className: 'mtc-small', style: { fontWeight: 600 } }, f.q),
              h('div', { className: 'mtc-math', style: { fontSize: 14, lineHeight: 1.9 } }, h(MathText, { text: f.a })),
              f.n ? h('div', { className: 'mtc-small mtc-muted' }, h(MathText, { text: f.n })) : null),
            h(Pill, null, MOD_MAP[f.m].short));
        }));
    }),
    !list.length ? h(Empty, null, '没搜到，换个关键词。') : null);
}

/* ================= 模考 ================= */
const PART_LIST = QUIZ_RULES.parts;

function ExamView(props) {
  const state = props.state;
  const [paper, setPaper] = useState(null);
  const [answers, setAnswers] = useState({});
  const [marks, setMarks] = useState({});
  const [left, setLeft] = useState(QUIZ_RULES.minutes * 60);
  const [result, setResult] = useState(null);

  useEffect(function () {
    if (!paper || result) return;
    const t = setInterval(function () {
      setLeft(function (x) {
        if (x <= 1) { clearInterval(t); return 0; }
        return x - 1;
      });
    }, 1000);
    return function () { clearInterval(t); };
  }, [paper, result]);

  function build() {
    const out = [];
    PART_LIST.forEach(function (p) {
      if (p.t === '证明' && !state.settings.proof) return;
      const pool = shuffled(BANK.filter(function (q) { return q.t === p.t && state.modules[q.m]; }).map(function (q) { return q.id; }), Date.now() + p.n);
      out.push({ t: p.t, per: p.per, ids: pool.slice(0, p.n) });
    });
    setPaper(out);
    setAnswers({});
    setMarks({});
    setLeft(QUIZ_RULES.minutes * 60);
    setResult(null);
  }

  function finish() {
    const secs = [];
    let got = 0;
    const loss = {};
    paper.forEach(function (part) {
      part.ids.forEach(function (id) {
        const q = BANK_MAP[id];
        let full = 0;
        if (part.t === '证明') full = marks[id] ? part.per : 0;
        else full = checkAnswer(q, answers[id] || '') ? part.per : 0;
        got += full;
        if (full < part.per) loss[q.m] = (loss[q.m] || 0) + (part.per - full);
        secs.push({ id: id, got: full, per: part.per });
      });
    });
    const mods = Object.keys(loss).sort(function (a, b) { return loss[b] - loss[a]; });
    setResult({ got: got, loss: loss, secs: secs, worst: mods[0] || null });
    props.set(function (st) {
      let s2 = st;
      secs.forEach(function (x) { s2 = recordAttempt(s2, x.id, x.got >= x.per, '', 0); });
      return Object.assign({}, s2, {
        exams: (s2.exams || []).concat([{ at: Date.now(), got: got, worst: mods[0] || null, n: secs.length }]).slice(-8),
      });
    });
  }

  useEffect(function () {
    if (paper && !result && left === 0) finish();
  }, [left, paper, result]);

  if (!paper) {
    return h(Card, null,
      h('h3', null, '模考', h('span', { className: 'n' }, '150 分 · 150 分钟')),
      h('div', { className: 'mtc-small' }, '按陕西卷结构组卷：填空 5×5 + 选择 5×5 + 计算 4×20 + 证明 1×20。评分只结果。'),
      h('div', { className: 'mtc-actions' }, h(Btn, { tone: 'primary', onClick: build }, '生成套卷')));
  }

  if (result) {
    const worstName = result.worst && MOD_MAP[result.worst] ? MOD_MAP[result.worst].name : '无';
    return h('div', null,
      h(Card, null,
        h('h3', null, '模考成绩'),
        h('div', { className: 'mtc-grid' },
          h(Stat, { k: '得分', v: result.got, unit: '/150' }),
          h(Stat, { k: '达标线', v: state.target, unit: '分' }),
          h(Stat, { k: '差距', v: Math.max(0, state.target - result.got), unit: '分' })),
        h('h3', { style: { marginTop: 16 } }, '失分模块分布'),
        Object.keys(result.loss).sort(function (a, b) { return result.loss[b] - result.loss[a]; }).map(function (k) {
          return h('div', { key: k, className: 'mtc-row' },
            h('span', { className: 'mtc-small', style: { width: 150, flex: 'none' } }, MOD_MAP[k].name),
            h('div', { className: 'grow' }, h(Bar, { value: result.loss[k] * 3 })),
            h('span', { className: 'mtc-small', style: { width: 56, textAlign: 'right', flex: 'none' } }, '-' + result.loss[k] + ' 分'));
        }),
        h('h3', { style: { marginTop: 16 } }, '最近模考',
          h('span', { className: 'n' }, '共 ' + (state.exams || []).length + ' 套')),
        (state.exams || []).slice(-3).reverse().map(function (x, i) {
          const d = new Date(x.at);
          return h('div', { key: i, className: 'mtc-row' },
            h('span', { className: 'mtc-small grow' }, (d.getMonth() + 1) + '月' + d.getDate() + '日 · ' + x.n + ' 题'),
            h('span', { className: 'mtc-small mtc-muted' }, x.worst && MOD_MAP[x.worst] ? '最弱：' + MOD_MAP[x.worst].short : '无失分'),
            h('span', { className: 'mtc-small', style: { width: 56, textAlign: 'right', flex: 'none' } }, x.got + ' 分'));
        }),
        h('div', { className: 'mtc-feedback' }, '下一步只修一块：' + worstName + '。其余模块先放着。'),
        h('div', { className: 'mtc-actions' },
          h(Btn, { tone: 'primary', onClick: function () { props.nav('practice', { m: result.worst }); } }, '去练' + worstName),
          h(Btn, { onClick: build }, '再考一套'))));
  }

  return h('div', null,
    h(Card, null,
      h('h3', null, '模考进行中',
        h('span', { className: 'n' }, '剩 ' + Math.floor(left / 60) + ':' + pad2(left % 60))),
      h('div', { className: 'mtc-timer' + (left < 600 ? ' warn' : '') }, Math.floor(left / 60) + ':' + pad2(left % 60)),
      paper.map(function (part) {
        return h('div', { key: part.t, style: { marginTop: 16 } },
          h('div', { className: 'mtc-sec' }, part.t + '（每题 ' + part.per + ' 分）'),
          part.ids.map(function (id, i2) {
            const q = BANK_MAP[id];
            return h('div', { key: id, style: { marginBottom: 14 } },
              h('div', { className: 'mtc-q', style: { fontSize: 14 } },
                h(MathText, { text: (i2 + 1) + '. ' + q.q })),
              part.t === '选择' ? h('div', null, q.opt.map(function (o, j) {
                return h('button', {
                  key: j, type: 'button', className: 'mtc-choice',
                  'data-state': answers[id] === o ? 'right' : undefined,
                  onClick: function () { setAnswers(Object.assign({}, answers, { [id]: o })); },
                }, String.fromCharCode(65 + j) + '. ', h(MathText, { text: o }));
              })) : part.t === '证明' ? h('div', { className: 'mtc-actions' },
                h(Btn, {
                  on: !!marks[id],
                  onClick: function () { setMarks(Object.assign({}, marks, { [id]: !marks[id] })); },
                }, marks[id] ? '已证出（20 分）' : '证出来了？点此计分')) : h('input', {
                className: 'mtc-input', style: { marginTop: 6 },
                value: answers[id] || '', placeholder: '最终答案',
                onChange: function (e) { setAnswers(Object.assign({}, answers, { [id]: e.target.value })); },
              }));
          }));
      }),
      h('div', { className: 'mtc-actions' },
        h(Btn, { tone: 'primary', onClick: finish }, '交卷'),
        h(Btn, { tone: 'ghost', onClick: function () { setPaper(null); } }, '放弃'))));
}

/* ================= 学习页：知识地图 + 必背公式 + 3 道阶梯例题 ================= */
function LearnView(props) {
  const state = props.state;
  const modId = (props.preset && props.preset.m) || state.currentModule || 'm1';
  const mod = MOD_MAP[modId] || MODULES[0];
  const info = LEARN_MAP[modId] || { map: '', analogy: '', watch: '' };
  const fs = FORMULAS.filter(function (f) { return f.m === modId; });
  const must = fs.slice(0, 6);
  const pool = BANK.filter(function (q) {
    return q.m === modId && q.t !== '证明' && state.modules[modId];
  });
  const ladder = [1, 2, 3].map(function (d) {
    return pool.filter(function (q) { return q.d === d; })[0] || null;
  }).filter(Boolean);
  const done = function (q) { return !!(q && state.bank[q.id] && state.bank[q.id].seen); };

  useEffect(function () {
    props.set(markLearned);
  }, [modId]);

  function start(i) {
    const q = ladder[i];
    if (!q) return;
    props.nav('practice', { m: modId, d: q.d, n: 1, auto: true, only: q.id });
  }

  return h('div', null,
    h(Card, null,
      h('h3', null, mod.name, h('span', { className: 'n' }, '知识地图')),
      h('div', { className: 'mtc-map' }, h(MathText, { text: info.map })),
      h('div', { className: 'mtc-small mtc-muted', style: { marginTop: 8 } }, '打个比方：', info.analogy),
      h('div', { className: 'mtc-small', style: { marginTop: 8 } }, h(Pill, { tone: 'warn' }, '注意'), h(MathText, { text: info.watch }))),

    h(Card, null,
      h('h3', null, '必背公式', h('span', { className: 'n' }, '★ 是这一层的核心')),
      must.length ? must.map(function (f, i) {
        return h('div', { key: f.q + i, className: 'mtc-row', style: { alignItems: 'flex-start' } },
          h('span', { className: 'mtc-small', style: { width: 18, flex: 'none', color: i < 3 ? '#a9701a' : '#9aa7a1' } }, i < 3 ? '★' : '·'),
          h('div', { className: 'grow' },
            h('div', { className: 'mtc-small mtc-muted' }, f.q),
            h('div', { className: 'mtc-f' }, h(MathText, { text: f.a }))));
      }) : h(Empty, null, '这个模块还没有公式条目。'),
      h('div', { className: 'mtc-actions' },
        h(Btn, { onClick: function () { props.nav('formulas', { m: modId }); } }, '看全部 ' + fs.length + ' 条'),
        h(Btn, { tone: 'ghost', onClick: function () { props.nav('cards', { m: modId }); } }, '拿这模块抽卡片'))),

    h(Card, null,
      h('h3', null, '阶梯例题', h('span', { className: 'n' }, '做完一道解锁下一道')),
      ladder.length ? ladder.map(function (q, i) {
        const unlocked = i === 0 || done(ladder[i - 1]);
        const finished = done(q);
        return h('div', { key: q.id, className: 'mtc-ladder' },
          h('div', { className: 'grow' },
            h('div', { className: 'mtc-small' },
              h(Pill, { tone: finished ? 'ok' : null }, '第 ' + (i + 1) + ' 题 · ' + (q.d === 1 ? '基础' : q.d === 2 ? '中档' : '中高')),
              ' ',
              h('span', { className: 'mtc-muted' }, q.kp)),
            h('div', { className: 'mtc-f', style: { marginTop: 4 } }, h(MathText, { text: q.q }))),
          unlocked
            ? h(Btn, { tone: finished ? 'ghost' : 'primary', onClick: function () { start(i); } }, finished ? '再做一次' : '开始')
            : h('span', { className: 'mtc-small mtc-muted', style: { flex: 'none' } }, '未解锁'));
      }) : h(Empty, null, '这个模块题库还不够，先去练习页。')),
  );
}

/* ===== app-command.js ===== */
/* ---------- 命令栏：/练 /学 /复习 /公式 /卡片 /日测 /模考 /规划 /状态 ---------- */
const CMD_HELP = [
  ['/练 极限 中档 5', '按模块·难度·题数练习'],
  ['/学 积分', '知识地图 + 必背公式 + 3 道阶梯例题'],
  ['/复习', '到期错题'],
  ['/公式 极坐标', '搜公式库'],
  ['/卡片 级数', '背公式卡片'],
  ['/日测', '5 题，限时 15 分钟'],
  ['/模考', '150 分钟套卷'],
  ['/规划', '三轮计划与落后重排'],
  ['/状态', '掌握度·错题·距考'],
  ['/诊', '错题本与归因'],
];

const DIFF_WORDS = { '基础': 1, '简单': 1, '中档': 2, '中等': 2, '中高': 3, '难': 3, '全部': 0, '不限': 0 };

function pickModuleId(tokens) {
  for (let i = 0; i < tokens.length; i += 1) {
    const t = tokens[i];
    const hit = MODULES.filter(function (m) {
      return m.id === t || m.short === t || m.name.indexOf(t) >= 0;
    })[0];
    if (hit) return hit.id;
  }
  return null;
}

function parseCommand(text, state) {
  const raw = String(text || '').trim();
  if (!raw) return { msg: '输入一个命令，例如 /练 极限 中档 5。' };
  const parts = raw.replace(/^\//, '').split(/[\s，,、]+/).filter(Boolean);
  const cmd = parts[0] || '';
  const rest = parts.slice(1);
  const diff = rest.map(function (t) { return DIFF_WORDS[t]; }).filter(function (x) { return x != null; })[0];
  const num = rest.map(function (t) { return /^\d+$/.test(t) ? parseInt(t, 10) : null; }).filter(function (x) { return x != null; })[0];
  const mod = pickModuleId(rest);

  if (cmd === '练' || cmd === '练习') {
    const n = num || state.settings.dailyQuestions || 8;
    return {
      tab: 'practice',
      preset: { m: mod || 'all', d: diff || 0, n: n, auto: true },
      msg: '练习：' + (mod ? MOD_MAP[mod].name : '全部模块') + ' · ' + (diff ? (diff === 1 ? '基础' : diff === 2 ? '中档' : '中高') : '不限难度') + ' · ' + n + ' 题',
    };
  }
  if (cmd === '学') {
    const m = mod || state.currentModule;
    return {
      tab: 'learn',
      preset: { m: m },
      msg: '学习页：' + MOD_MAP[m].name + ' 的知识地图、必背公式、3 道阶梯例题。',
    };
  }
  if (cmd === '复习' || cmd === '错' || cmd === '错题') {
    return { tab: 'practice', preset: { review: true, auto: true }, msg: '复习到期错题（1/3/7/15 天曲线）。' };
  }
  if (cmd === '诊' || cmd === '诊断') {
    return { tab: 'mistakes', preset: { add: true }, msg: '错题本：手录这道错题 → 选错因 → 记识别信号 → 进 1/3/7/15 复习。' };
  }
  if (cmd === '公式') {
    return { tab: 'formulas', preset: { q: rest.join(' ') }, msg: rest.length ? '搜索公式：' + rest.join(' ') : '公式库全览。' };
  }
  if (cmd === '卡片' || cmd === '背') {
    return { tab: 'cards', preset: { m: mod || 'all' }, msg: '卡片：' + (mod ? MOD_MAP[mod].name : '全部模块') + '。' };
  }
  if (cmd === '日测' || cmd === '测') {
    return {
      tab: 'practice',
      preset: { m: 'all', d: 0, n: 5, daily: true, timed: 15, auto: true },
      msg: '日测 5 题 = 近 7 天错题 3 道 + 滚动 2 道，限时 15 分钟。',
    };
  }
  if (cmd === '模考' || cmd === '考试') {
    return { tab: 'exam', msg: '模考：填空 25 + 选择 25 + 计算 80 + 证明 20，150 分钟。' };
  }
  if (cmd === '规划' || cmd === '计划') {
    return { tab: 'plan', msg: '三轮计划与落后重排。' };
  }
  if (cmd === '状态' || cmd === 'setup' || cmd === '配置') {
    return { tab: 'status', msg: '状态：掌握度、错题、距考天数、模块开关。' };
  }
  if (cmd === '重置') {
    return { tab: 'status', msg: '重置在「状态」页底部，需要点两次确认才清空。' };
  }
  if (cmd === '帮助' || cmd === 'help' || cmd === '?') {
    return { msg: '命令：' + CMD_HELP.map(function (x) { return x[0]; }).join('  ') };
  }
  return { msg: '不认识的命令「' + cmd + '」。可用：/练 /学 /复习 /公式 /卡片 /日测 /模考 /规划 /状态 /诊' };
}

function CommandBar(props) {
  const [text, setText] = useState('');
  function run() {
    const res = parseCommand(text, props.state);
    if (res) props.onRun(res);
    setText('');
  }
  return h('div', { className: 'mtc-cmd' },
    h('div', { className: 'mtc-cmd-row' },
      h('span', { className: 'mtc-cmd-prefix' }, '/'),
      h('input', {
        className: 'mtc-input mtc-cmd-input', value: text, autoFocus: true,
        placeholder: '练 极限 中档 5',
        onChange: function (e) { setText(e.target.value); },
        onKeyDown: function (e) { if (e.key === 'Enter') run(); if (e.key === 'Escape') props.onClose(); },
      }),
      h(Btn, { tone: 'primary', onClick: run }, '执行'),
      h(Btn, { tone: 'ghost', onClick: props.onClose }, '关闭')),
    props.msg ? h('div', { className: 'mtc-small mtc-muted', style: { marginTop: 6 } }, props.msg) : null,
    h('div', { className: 'mtc-cmd-help' }, CMD_HELP.map(function (x) {
      return h('button', {
        key: x[0], type: 'button', className: 'mtc-cmd-chip', title: x[1],
        onClick: function () { setText(x[0].replace(/^\//, '')); },
      }, x[0]);
    })));
}

function CoachPage() {
  const storeState = useState(loadState);
  const state = storeState[0];
  const setState = storeState[1];
  const tabState = useState('today');
  const tab = tabState[0];
  const setTab = tabState[1];
  const presetState = useState(null);
  const preset = presetState[0];
  const setPreset = presetState[1];
  const cmdState = useState(false);
  const cmdOpen = cmdState[0];
  const setCmdOpen = cmdState[1];
  const cmdMsgState = useState('');
  const cmdMsg = cmdMsgState[0];
  const setCmdMsg = cmdMsgState[1];
  const rootRef = React.useRef(null);

  useStyleOnce();
  useEffect(function () { saveState(state); }, [state]);
  useEffect(function () {
    if (rootRef.current) rootRef.current.scrollTop = 0;
  }, [tab]);

  const left = daysUntil(state.examDate);

  useEffect(function () {
    if (!cmdMsg || cmdOpen) return undefined;
    const t = setTimeout(function () { setCmdMsg(''); }, 3600);
    return function () { clearTimeout(t); };
  }, [cmdMsg, cmdOpen]);

  function nav(next, params) {
    setPreset(params || null);
    setTab(next || 'today');
  }

  function runCommand(res) {
    if (!res) return;
    if (res.tab) nav(res.tab, res.preset || null);
    setCmdMsg(res.msg || '');
    if (res.tab) setCmdOpen(false);
  }

  const common = { state: state, set: setState, nav: nav };

  let body = null;
  if (tab === 'today') body = h(TodayView, common);
  else if (tab === 'practice') body = h(PracticeView, Object.assign({}, common, {
    preset: preset,
    mode: preset && preset.review ? 'review' : 'practice',
    key: preset ? JSON.stringify(preset) : 'default',
  }));
  else if (tab === 'mistakes') body = h(MistakesView, Object.assign({}, common, { preset: preset }));
  else if (tab === 'learn') body = h(LearnView, Object.assign({}, common, { preset: preset }));
  else if (tab === 'formulas') body = h(FormulasView, Object.assign({}, common, { preset: preset }));
  else if (tab === 'cards') body = h(CardsView, Object.assign({}, common, { preset: preset }));
  else if (tab === 'plan') body = h(PlanView, common);
  else if (tab === 'exam') body = h(ExamView, common);
  else body = h(StatusView, common);

  return h('div', { className: 'mtc-root', 'data-theme': state.settings.theme || 'light', ref: rootRef },
    h('div', { className: 'mtc-wrap' },
      h('div', { className: 'mtc-head' },
        h('div', { className: 'mtc-logo' }, '∫'),
        h('div', { className: 'mtc-titles' },
          h('h1', null, '高数教练'),
          h('p', null, '陕西专升本 · ' + state.examDate + ' · 目标 ' + state.target + '/150')),
        h('div', { className: 'mtc-spacer' }),
        h('div', { className: 'mtc-count' }, h('b', null, left == null ? '—' : left), ' 天'),
        h('button', {
          type: 'button', className: 'mtc-theme-btn', title: '命令（/练 /学 /公式 …）',
          onClick: function () { setCmdOpen(!cmdOpen); },
        }, '⌘'),
        h('button', {
          type: 'button', className: 'mtc-theme-btn', title: '切换深浅色',
          onClick: function () {
            setState(function (s) {
              return Object.assign({}, s, { settings: Object.assign({}, s.settings, { theme: s.settings.theme === 'dark' ? 'light' : 'dark' }) });
            });
          },
        }, state.settings.theme === 'dark' ? '☀' : '☾')),
      h('div', { className: 'mtc-tabs' }, TABS.map(function (x) {
        return h('button', {
          key: x.k, type: 'button', className: 'mtc-tab', 'data-active': tab === x.k ? 'true' : 'false',
          onClick: function () { nav(x.k); },
        }, x.label);
      })),
      cmdOpen ? h(CommandBar, {

        onClose: function () { setCmdOpen(false); },
      }) : null,
      body,
      cmdMsg && !cmdOpen ? h('div', { className: 'mtc-toast' }, cmdMsg) : null));
}
